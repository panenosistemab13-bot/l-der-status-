<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="google" content="notranslate" />
    <meta name="theme-color" content="#1e3a8a" />
    <meta name="description" content="Status Lider App" />
    <title>Status Lider</title>
    <link rel="icon" type="image/png" href="https://i.postimg.cc/WbTC67S5/lider-3-logo-png-transparent.png" />
    <link rel="apple-touch-icon" href="https://i.postimg.cc/WbTC67S5/lider-3-logo-png-transparent.png" />
    <link rel="manifest" href="/manifest.json" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch(err => {
            console.log('ServiceWorker registration failed: ', err);
          });
        });
      }
    </script>
  </body>
</html>
